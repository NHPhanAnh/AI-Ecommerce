{% extends 'base.html' %}
{% block title %}Khách hàng Đăng nhập{% endblock %}
{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5">
        <div class="card shadow">
            <div class="card-header bg-primary text-white text-center">
                <h4>Khách Hàng Đăng Nhập</h4>
            </div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <button type="submit" class="btn btn-primary w-100 mt-2 fw-bold">Đăng Nhập</button>
                    <div class="mt-3 text-center">
                        <small>Bạn chưa có tài khoản? <a href="{% url 'register' %}" class="text-decoration-none fw-bold">Đăng ký ngay</a></small>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
