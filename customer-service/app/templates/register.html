{% extends 'base.html' %}
{% block title %}Khách hàng Đăng Ký{% endblock %}
{% block content %}
<style>
    /* Hide Django's default help texts (requirements list) */
    .helptext {
        display: none !important;
    }
    
    /* Style Django's error list to be red warnings */
    .errorlist {
        color: #dc3545 !important;
        font-size: 0.85rem;
        padding-left: 0;
        list-style-type: none;
        margin-top: 0.5rem;
        margin-bottom: 0.5rem;
        font-weight: bold;
    }
    
    /* Make Django default inputs look like Bootstrap form-controls */
    input[type="text"], input[type="password"] {
        display: block;
        width: 100%;
        padding: 0.5rem 0.75rem;
        font-size: 1rem;
        font-weight: 400;
        line-height: 1.5;
        color: #212529;
        background-color: #fff;
        border: 1px solid #ced4da;
        border-radius: 0.375rem;
        transition: border-color .15s ease-in-out,box-shadow .15s ease-in-out;
        margin-top: 0.3rem;
    }
    
    /* Make labels look bolder */
    form p label {
        font-weight: bold;
        color: #495057;
    }
    
    form p {
        margin-bottom: 1.25rem;
    }
</style>

<div class="row justify-content-center mt-5">
    <div class="col-md-5">
        <div class="card shadow">
            <div class="card-header bg-primary text-white text-center border-0 p-3">
                <h4 class="mb-0 fw-bold">Đăng Ký Tài Khoản Mới</h4>
            </div>
            <div class="card-body p-4">
                <form method="post">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <button type="submit" class="btn btn-primary w-100 mt-3 fw-bold py-2">Tạo Tài Khoản</button>
                    <div class="mt-4 text-center">
                        <small>Đã có tài khoản? <a href="{% url 'login' %}" class="text-decoration-none fw-bold text-primary">Đăng nhập</a></small>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
