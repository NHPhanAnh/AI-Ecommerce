services:
  mysql-db:
    image: mysql:8.0
    container_name: kiemtra-mysql-db
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: customer_db
    ports:
      - "3308:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init-mysql.sql:/docker-entrypoint-initdb.d/init-mysql.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-db:
    image: postgres:15
    container_name: kiemtra-postgres-db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: product_db
    ports:
      - "5434:5432"
    volumes:
      - postgres_data_v15:/var/lib/postgresql/data
      - ./init-postgres.sql:/docker-entrypoint-initdb.d/init-postgres.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user"]
      interval: 10s
      timeout: 5s
      retries: 5

  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kiemtra-api-gateway
    command: python api-gateway/manage.py runserver 0.0.0.0:8080
    volumes:
      - .:/app
    ports:
      - "8080:8080"
    depends_on:
      - mysql-db
      - postgres-db

  customer-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kiemtra-customer-service
    command: python customer-service/manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - DB_HOST=mysql-db
      - DB_PORT=3306
      - PRODUCT_SERVICE_URL=http://product-service:8002
    depends_on:
      - mysql-db
      - product-service

  staff-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kiemtra-staff-service
    command: python staff-service/manage.py runserver 0.0.0.0:8001
    volumes:
      - .:/app
    ports:
      - "8001:8001"
    environment:
      - DB_HOST=mysql-db
      - DB_PORT=3306
      - PRODUCT_SERVICE_URL=http://product-service:8002
    depends_on:
      - mysql-db
      - product-service

  product-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kiemtra-product-service
    command: python product-service/manage.py runserver 0.0.0.0:8002
    volumes:
      - .:/app
    ports:
      - "8002:8002"
    environment:
      - DB_HOST=postgres-db
      - DB_PORT=5432
    depends_on:
      - postgres-db

  ai-chat-service:
    build:
      context: ./ai-chat-service
      dockerfile: Dockerfile
    container_name: kiemtra-ai-chat
    volumes:
      - ./ai-chat-service:/app
    ports:
      - "8005:8005"
    environment:
      - GOOGLE_API_KEY=AIzaSyCxfEZhvG5T8BdEZJI4eLgNRIHaBxDzJac
      - PRODUCT_SERVICE_URL=http://product-service:8002/products/
    depends_on:
      - product-service

volumes:
  mysql_data:
  postgres_data_v15:
