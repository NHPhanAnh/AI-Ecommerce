{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm border-secondary">
            <div class="card-header bg-secondary text-white">Thêm mặt hàng mới</div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label>Loại sản phẩm</label>
                        <select name="item_type" class="form-select">
                            <option value="laptop">Laptop</option>
                            <option value="mobile">Điện thoại (Mobile)</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label>Tên sản phẩm</label>
                        <input type="text" name="name" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label>Giá ($)</label>
                        <input type="number" step="0.01" name="price" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label>Số lượng (Kho)</label>
                        <input type="number" name="stock" class="form-control" value="10" required>
                    </div>
                    <div class="mb-3">
                        <label>Giảm giá (%)</label>
                        <input type="number" name="discount_percent" class="form-control" value="0" min="0" max="100" required>
                    </div>
                    <div class="mb-3">
                        <label>Chi tiết (Mô tả)</label>
                        <textarea name="description" class="form-control" rows="3"></textarea>
                    </div>
                    <div class="mb-3">
                        <label>Đường dẫn hình ảnh (URL)</label>
                        <input type="url" name="image_url" class="form-control" placeholder="https://example.com/image.jpg">
                    </div>
                    <button type="submit" class="btn btn-success">Lưu sản phẩm</button>
                    <a href="{% url 'manager_home' %}" class="btn btn-outline-secondary ms-2">Hủy bỏ</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
